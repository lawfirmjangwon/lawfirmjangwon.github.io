<style>
:root{--bg:#eef0f2;--paper:#fff;--ink:#1d2733;--muted:#5b6672;--line:#d5dade;--band:#2b3542;--bandText:#f3f1ec;--bronze:#8a6a3a;--btn:#2b3542}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--paper:#1d232a;--ink:#e7eaee;--muted:#9aa4ae;--line:#323b45;--band:#0f141a;--bandText:#ece8df;--bronze:#c49a5c;--btn:#3a4757;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:440px;margin:max(10px,env(safe-area-inset-top,0px)) auto max(10px,env(safe-area-inset-bottom,0px));background:var(--paper);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;width:calc(100% - 20px)}
.top{background:var(--band);color:var(--bandText);padding:24px 16px 20px;text-align:center}
.firm{display:flex;align-items:center;justify-content:center;gap:12px;font-family:"Noto Serif KR",serif;font-weight:700;font-size:clamp(1.45rem,7.4vw,1.9rem);letter-spacing:.1em;line-height:1.2;white-space:nowrap}
.mark{width:48px;height:48px;border-radius:50%;border:2px solid var(--bronze);display:grid;place-items:center;letter-spacing:.02em;font-size:.95rem;flex:none}
.person{margin-top:14px;display:flex;align-items:baseline;justify-content:center;gap:10px;white-space:nowrap}
.role{font-size:.95rem;opacity:.8}
.name{font-family:"Noto Serif KR",serif;font-weight:700;font-size:1.25rem;letter-spacing:.02em;line-height:1.2}
.btns{display:flex;flex-direction:column;gap:10px;padding:14px 12px 14px}
.btn{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:14px;background:var(--btn);color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.btn svg{width:28px;height:28px;flex:none}
.btn b{display:block;font-size:1.08rem;font-weight:700}
.btn small{display:block;font-size:.86rem;opacity:.85;white-space:nowrap}
.btn b{white-space:nowrap}
.btn > span{min-width:0}
.btn.sub{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px}
.fax{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;border-radius:14px;background:var(--bg);color:var(--ink);min-height:64px}
.fax small{font-size:.8rem;color:var(--muted)} .fax span{font-size:.95rem;font-weight:500;white-space:nowrap}
.btn.static{background:var(--bg);color:var(--ink);user-select:text;-webkit-user-select:text}
.btn.static:active{transform:none}
.btn.static{justify-content:center;text-align:center}
.btn.static b{font-size:clamp(.92rem,4.3vw,1.08rem)}
.zip{display:block;font-size:.72rem;opacity:.75;letter-spacing:.04em}
.park{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;font-size:.74rem;font-weight:500;vertical-align:2px;opacity:.9}

.lp{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lp.hold{outline:3px solid var(--bronze);outline-offset:2px}
.hint{display:block;font-size:clamp(.66rem,3vw,.74rem);opacity:.75;margin-top:2px;white-space:nowrap}
.addr{font-size:clamp(.8rem,3.7vw,.9rem)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.92}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;text-align:left}
.cs{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:#fff}
.cs b{display:flex;align-items:baseline;gap:6px;font-size:1rem;white-space:nowrap}
.cs b svg{align-self:center}
.cs b i{font-style:normal;font-size:.68rem;font-weight:500;opacity:.9}
.cs svg{width:18px;height:18px}
.cs small{font-size:.72rem;opacity:.85;white-space:nowrap}
.cs.t{background:#2f6fd1}.cs.s{background:#b4532a}
</style>
</head>

<div class="toast" id="toast">복사했습니다</div>
<script>
(function(){
  var toast=document.getElementById('toast'),tt;
  function show(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},1600)}
  function copy(text){
    function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);show(ok?'복사했습니다':'복사하지 못했습니다')}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){show('복사했습니다')},fallback)}else{fallback()}
  }
  document.querySelectorAll('.lp').forEach(function(el){
    var timer=null,ready=false,used=false;
    function start(){ready=false;used=false;clearTimeout(timer);timer=setTimeout(function(){ready=true;el.classList.add('hold');if(navigator.vibrate){try{navigator.vibrate(20)}catch(e){}}},550)}
    function end(e){clearTimeout(timer);el.classList.remove('hold');if(ready){ready=false;used=true;if(e&&e.cancelable)e.preventDefault();copy(el.getAttribute('data-copy'))}}
    function cancel(){clearTimeout(timer);ready=false;el.classList.remove('hold')}
    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',end);
    el.addEventListener('touchmove',cancel,{passive:true});
    el.addEventListener('touchcancel',cancel);
    el.addEventListener('mousedown',start);
    el.addEventListener('mouseup',end);
    el.addEventListener('mouseleave',cancel);
    el.addEventListener('click',function(e){if(used){e.preventDefault();used=false}});
    el.addEventListener('contextmenu',function(e){e.preventDefault()});
  });
})();
</script>
