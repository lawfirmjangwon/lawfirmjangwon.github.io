<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윤장원 변호사 · 법무법인 장원</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef0f2;--paper:#fff;--ink:#1d2733;--muted:#5b6672;--line:#d5dade;--band:#2b3542;--bandText:#f3f1ec;--bronze:#8a6a3a;--btn:#2b3542}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--paper:#1d232a;--ink:#e7eaee;--muted:#9aa4ae;--line:#323b45;--band:#0f141a;--bandText:#ece8df;--bronze:#c49a5c;--btn:#3a4757;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{background:var(--band);color:var(--bandText);padding:calc(28px + env(safe-area-inset-top,0px)) 22px 26px}
.firm{display:flex;align-items:center;gap:14px;font-family:"Noto Serif KR",serif;font-weight:700;font-size:1.9rem;letter-spacing:.14em;line-height:1.2}
.mark{width:48px;height:48px;border-radius:50%;border:2px solid var(--bronze);display:grid;place-items:center;letter-spacing:.02em;font-size:.95rem;flex:none}
.person{margin-top:20px;display:flex;align-items:baseline;gap:10px}
.role{font-size:.95rem;opacity:.8}
.name{font-family:"Noto Serif KR",serif;font-weight:700;font-size:1.25rem;letter-spacing:.3em;line-height:1.2}
.btns{display:flex;flex-direction:column;gap:12px;padding:22px 18px 8px}
.btn{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;border-radius:14px;background:var(--btn);color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.btn svg{width:28px;height:28px;flex:none}
.btn b{display:block;font-size:1.08rem;font-weight:700}
.btn small{display:block;font-size:.86rem;opacity:.85;word-break:break-all}
.btn.sub{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px}
.fax{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;border-radius:14px;background:var(--bg);color:var(--ink);min-height:64px}
.fax small{font-size:.8rem;color:var(--muted)} .fax span{font-size:.95rem;font-weight:500;white-space:nowrap}
.btn.static{background:var(--bg);color:var(--ink);cursor:text;user-select:text;-webkit-user-select:text}
.btn.static:active{transform:none}
.btn.static b{word-break:break-all}
.zip{display:block;font-size:.72rem;opacity:.75;letter-spacing:.04em}
.park{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;font-size:.74rem;font-weight:500;vertical-align:2px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="firm"><span class="mark">JW</span>법무법인 장원</div>
    <div class="person"><span class="role">대표변호사</span><span class="name">윤장원</span></div>
  </header>

  <nav class="btns">
    <div class="row">
    <a class="btn" href="tel:0519490001">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      <span><b>전화 걸기</b><small>051-949-0001</small></span>
    </a>
    <div class="fax"><small>팩스</small><span>051-506-3619</span></div>
    </div>
    <div class="btn static">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      <span><b>jangwon@lawfirmjangwon.com</b><small>이메일</small></span>
    </div>
    <a class="btn" href="https://place.map.kakao.com/672218575" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span><b>찾아오시는 길<span class="park">유료 주차장 있음</span></b><small><span class="zip">47511</span>부산광역시 연제구 법원로 42, 대한빌딩 3층</small></span>
    </a>
    <a class="btn sub" href="법무법인%20장원.vcf" download="법무법인 장원.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span><b>연락처 저장</b><small>주소록에 한 번에 저장</small></span>
    </a>
  </nav>
</div>
</body>
</html>
